version: "3.9"

services:
  backend:
    build: ./backend
    container_name: codebaseai_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      - postgres
      - neo4j
      - qdrant
    volumes:
      - ./data:/app/data

  frontend:
    build: ./frontend
    container_name: codebaseai_frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend

  postgres:
    image: postgres:15
    container_name: codebaseai_postgres
    environment:
      POSTGRES_USER: codebaseai
      POSTGRES_PASSWORD: codebaseai
      POSTGRES_DB: codebaseai
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  neo4j:
    image: neo4j:5
    container_name: codebaseai_neo4j
    environment:
      NEO4J_AUTH: neo4j/codebaseai
    ports:
      - "7474:7474"   # HTTP browser
      - "7687:7687"   # Bolt
    volumes:
      - neo4j_data:/data

  qdrant:
    image: qdrant/qdrant:latest
    container_name: codebaseai_qdrant
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  neo4j_data:
  qdrant_data:
